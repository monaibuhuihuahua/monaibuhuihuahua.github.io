<body>
  <div class="page-shell content-page">
    <a class="back-link" href="../">返回主页</a>
    <section class="content-card">
      <p class="eyebrow">Photography</p>
      <h1>生活摄影</h1>
      <p>这里可以放照片、拍摄时间、地点，以及那一刻你真正想记住的故事。</p>
      <ul>
        <li>适合按街头、旅行、日常和人物等主题建立相册</li>

        <li>后续也可以继续加照片详情页或相册封面页</li>
      </ul>
    </section>

    <section class="post-list">
      <article class="post-preview">
        <p class="meta-line">示例相册</p>
        <h3>雨后傍晚的街道，颜色比白天更安静</h3>
